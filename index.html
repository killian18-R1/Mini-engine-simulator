<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Engine Simulator</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
        BARRE SUPERIEURE
========================= -->


<header class="topbar">


<button id="soundButton" class="topButton">

🔇

</button>


<button id="settingsButton" class="topButton">

⚙

</button>


</header>





<!-- =========================
        TABLEAU DE BORD
========================= -->


<main class="dashboard">



<section class="gauge">


<canvas 
id="speedGauge"
width="300"
height="300">
</canvas>


<div class="gaugeLabel">

KM/H

</div>


</section>





<section id="gearDisplay">

N

</section>





<section class="gauge">


<canvas 
id="rpmGauge"
width="300"
height="300">
</canvas>


<div class="gaugeLabel">

RPM

</div>


</section>



</main>





<!-- =========================
        COMMANDES
========================= -->


<footer>


<div class="controls">



<button 
id="brakeButton"
class="controlButton">

Brake

</button>




<div class="gearControls">


<button 
id="gearDown"
class="gearButton">

-

</button>



<button 
id="gearUp"
class="gearButton">

+

</button>



</div>





<button 
id="gasButton"
class="controlButton">

Gaz

</button>



</div>




<div id="version">

</div>



</footer>







<!-- =========================
        MENU PARAMETRES
========================= -->


<div id="settingsPanel">



<div class="settingsBox">



<button 
id="closeSettings">

✕

</button>




<h2>
Paramètres véhicule
</h2>




<div id="vehicleInfo">

Chargement...

</div>




<hr>





<h3>
Modification véhicule
</h3>






<div class="parameter">


<label for="massInput">

Masse (kg)

</label>


<input

id="massInput"

type="number"

value="200"

>


</div>







<div class="parameter">


<label for="powerInput">

Puissance (ch)

</label>


<input

id="powerInput"

type="number"

value="150"

>


</div>







<div class="parameter">


<label for="torqueInput">

Couple (Nm)

</label>


<input

id="torqueInput"

type="number"

value="110"

>


</div>







<div class="parameter">


<label for="idleRPMInput">

Ralenti (tr/min)

</label>


<input

id="idleRPMInput"

type="number"

value="1300"

>


</div>







<div class="parameter">


<label for="maxRPMInput">

Régime maximum (tr/min)

</label>


<input

id="maxRPMInput"

type="number"

value="14000"

>


</div>







<button

id="applySettings"

class="applyButton">

Appliquer

</button>





</div>


</div>







<script src="script.js"></script>


</body>


</html>
