<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Engine Simulator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="topbar">

<button class="icon-btn">🔇</button>

<button class="icon-btn">⚙</button>

</div>

<div class="dashboard">

<div class="gauge">

<div class="gauge-title">
KM/H
</div>

<div class="needle"></div>

<div class="value">
000
</div>

</div>

<div class="gear-box">
N
</div>

<div class="gauge">

<div class="gauge-title">
RPM
</div>

<div class="needle"></div>

<div class="value">
0000
</div>

</div>

</div>

<div class="controls">

<button class="control-btn">
Brake
</button>

<div class="gear-buttons">

<button class="gear-btn">
-
</button>

<button class="gear-btn">
+
</button>

</div>

<button class="control-btn">
Gaz
</button>

</div>

<script src="script.js"></script>

</body>

</html>
