<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mini Engine Simulator</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- =========================
            BARRE SUPERIEURE
    ========================== -->

    <header class="topbar">

        <button id="soundButton"
                class="topButton"
                title="Son">

            🔇

        </button>

        <button id="settingsButton"
                class="topButton"
                title="Paramètres">

            ⚙

        </button>

    </header>



    <!-- =========================
            TABLEAU DE BORD
    ========================== -->

    <main class="dashboard">

        <!-- VITESSE -->

        <section class="gauge">

            <canvas id="speedGauge"
                    width="300"
                    height="300">
            </canvas>

            <div class="gaugeLabel">

                KM/H

            </div>

        </section>



        <!-- RAPPORT -->

        <section id="gearDisplay">

            N

        </section>



        <!-- RPM -->

        <section class="gauge">

            <canvas id="rpmGauge"
                    width="300"
                    height="300">
            </canvas>

            <div class="gaugeLabel">

                RPM

            </div>

        </section>

    </main>



    <!-- =========================
            COMMANDES
    ========================== -->

    <footer>

        <div class="controls">

            <button id="brakeButton"
                    class="controlButton">

                Brake

            </button>



            <div class="gearControls">

                <button id="gearDown"
                        class="gearButton">

                    -

                </button>

                <button id="gearUp"
                        class="gearButton">

                    +

                </button>

            </div>



            <button id="gasButton"
                    class="controlButton">

                Gaz

            </button>

        </div>



        <div id="version">

            v0.0.5B

        </div>

    </footer>



    <!-- =========================
            FENETRE PARAMETRES
    ========================== -->

    <div id="settingsPanel">

        <div class="settingsBox">

            <button id="closeSettings">

                ✕

            </button>

            <h2>

                Paramètres véhicule

            </h2>

            <div id="vehicleInfo">

                Chargement...

            </div>

        </div>

    </div>



    <!-- =========================
            SCRIPT PRINCIPAL
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
