<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Engine Simulator</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">


<button id="soundButton" class="topButton">
🔇
</button>


<button id="settingsButton" class="topButton">
⚙
</button>


</header>





<main class="dashboard">



<section class="gauge">

<canvas 
id="speedGauge"
width="300"
height="300">
</canvas>


<div class="gaugeLabel">
KM/H
</div>


</section>





<section id="gearDisplay">

N

</section>





<section class="gauge">


<canvas 
id="rpmGauge"
width="300"
height="300">
</canvas>


<div class="gaugeLabel">

RPM

</div>


</section>



</main>







<footer>


<div class="controls">



<button 
id="brakeButton"
class="controlButton">

Brake

</button>




<div class="gearControls">


<button 
id="gearDown"
class="gearButton">

-

</button>



<button 
id="gearUp"
class="gearButton">

+

</button>



</div>





<button 
id="gasButton"
class="controlButton">

Gaz

</button>



</div>





<div id="version">

</div>


</footer>









<div id="settingsPanel">



<div class="settingsBox">



<button id="closeSettings">

✕

</button>




<h2>
Paramètres véhicule
</h2>




<div id="vehicleInfo">

Chargement...

</div>




<hr>



<h3>
Modification véhicule
</h3>






<div class="parameter">


<label>
Masse (kg)
</label>


<input 
id="massInput"
type="number">

</div>







<div class="parameter">


<label>
Puissance (ch)
</label>


<input 
id="powerInput"
type="number">

</div>







<div class="parameter">


<label>
Couple (Nm)
</label>


<input 
id="torqueInput"
type="number">

</div>







<div class="parameter">


<label>
Ralenti (tr/min)
</label>


<input 
id="idleRPMInput"
type="number">

</div>







<div class="parameter">


<label>
Régime maximum (tr/min)
</label>


<input 
id="maxRPMInput"
type="number">

</div>







<button 
id="applySettings"
class="applyButton">

Appliquer

</button>



</div>

</div>







<!-- =========================
        PHYSIQUE v0.0.5
========================= -->


<script src="physics/torqueCurve.js"></script>

<script src="physics/engine.js"></script>





<!-- =========================
        CONTROLEUR JEU
========================= -->


<script src="script.js"></script>



</body>

</html>
