<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mini Engine Simulator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Barre supérieure -->

    <header class="topbar">

        <button id="soundButton" class="topButton">
            🔇
        </button>

        <button id="settingsButton" class="topButton">
            ⚙
        </button>

    </header>


    <!-- Tableau de bord -->

    <main>

        <section class="dashboard">

            <!-- Vitesse -->

            <div class="gauge">

                <canvas id="speedGauge"
                        width="300"
                        height="300">
                </canvas>

                <div class="gaugeLabel">

                    KM/H

                </div>

            </div>


            <!-- Rapport -->

            <div id="gearDisplay">

                N

            </div>


            <!-- RPM -->

            <div class="gauge">

                <canvas id="rpmGauge"
                        width="300"
                        height="300">
                </canvas>

                <div class="gaugeLabel">

                    RPM

                </div>

            </div>

        </section>

    </main>


    <!-- Commandes -->

    <footer>

        <div class="controls">

            <button id="brakeButton"
                    class="controlButton">

                Brake

            </button>


            <div class="gearButtons">

                <button id="gearDown">

                    -

                </button>

                <button id="gearUp">

                    +

                </button>

            </div>


            <button id="gasButton"
                    class="controlButton">

                Gaz

            </button>

        </div>


        <!-- Version -->

        <div id="version">

            v0.0.1

        </div>

    </footer>

    <script src="script.js"></script>

</body>

</html>
